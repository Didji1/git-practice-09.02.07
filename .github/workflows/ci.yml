name: C# CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Run Linter Simulation
      run: echo "Linter checks passed successfully!"

    - name: Run Tests Simulation
      run: echo "All unit tests passed!"